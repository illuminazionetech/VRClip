name: Build

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  # Never cancel a run on main: it may be publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      previous: ${{ steps.next.outputs.previous }}
      bump: ${{ steps.next.outputs.bump }}
      release: ${{ steps.next.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version from commits since the last release
        id: next
        run: |
          .github/scripts/next-version.sh | tee -a "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Version"
            echo "| | |"
            echo "|---|---|"
            echo "| Previous release | \`${{ steps.next.outputs.previous || 'none' }}\` |"
            echo "| This build | \`${{ steps.next.outputs.version }}\` (${{ steps.next.outputs.bump }}) |"
            echo "| App code changed | ${{ steps.next.outputs.release }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint & format check
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Check Kotlin formatting
        run: ./gradlew ktfmtCheck

      - name: Android Lint
        run: ./gradlew :app:lintGenericDebug -Pvrclip.versionName=${{ needs.version.outputs.version }}

      - name: Print lint findings
        if: always()
        run: cat app/build/reports/lint-results-genericDebug.txt 2>/dev/null || true

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.*
          if-no-files-found: ignore

  test:
    name: Unit tests
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Run unit tests
        run: ./gradlew :app:testGenericDebugUnitTest -Pvrclip.versionName=${{ needs.version.outputs.version }}

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  build:
    name: Build APK
    needs: version
    runs-on: ubuntu-latest
    outputs:
      release-signed: ${{ steps.verify.outputs.signed }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Set up release signing
        # Writes keystore.properties from the KEYSTORE_B64 and KEYSTORE_PASSWORD repository
        # secrets. Secrets are not available to pull requests from forks; those builds fall back
        # to the debug key and are never published.
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Signing secrets are not configured: this build uses the debug key and cannot be published as a release."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-vrclip}"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > keystore.properties
          echo "Release signing configured."

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease -Pvrclip.versionName=$VERSION --stacktrace

      - name: Build release App Bundle
        # The bundle task cannot resolve a single output while per-ABI APK splits are enabled,
        # so the bundle is built separately with splits off; a bundle carries every ABI anyway.
        run: ./gradlew :app:bundleGenericRelease -PnoSplits -Pvrclip.versionName=$VERSION --stacktrace

      - name: Verify release signature
        id: verify
        run: |
          shopt -s nullglob
          files=(app/build/outputs/apk/*/release/*.apk app/build/outputs/bundle/genericRelease/*.aab)
          if .github/scripts/verify-release-signature.sh "${files[@]}"; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::These builds are not signed with the release key; they can be tested but will not be published."
          fi

      - name: Build debug APK
        # Convenience artifact for manual QA; installs next to the release app (.debug suffix).
        continue-on-error: true
        run: ./gradlew :app:assembleGenericDebug -Pvrclip.versionName=$VERSION

      - name: Upload release APKs
        uses: actions/upload-artifact@v7
        with:
          name: VRClip-${{ env.VERSION }}-release-apks
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

      - name: Upload release App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: VRClip-${{ env.VERSION }}-release-aab
          path: app/build/outputs/bundle/genericRelease/*.aab
          if-no-files-found: error

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: VRClip-${{ env.VERSION }}-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: ignore

  mirror-model:
    name: Mirror the depth model
    # Keeps a verified copy of the 2D to 3D model in the depth-model release, the app's second
    # download source. Cheap when the copy is already there: one API call.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish the model if it is missing
        run: .github/scripts/mirror-depth-model.sh

  release:
    name: Publish release
    # Only a push to main that changed app code publishes, and only after lint, tests and the
    # build succeeded. The tag and the GitHub Release are created in this same job (a tag pushed
    # with GITHUB_TOKEN would not trigger another workflow run).
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.version.outputs.release == 'true'
    needs: [version, lint, test, build]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse builds without the release signature
        if: needs.build.outputs.release-signed != 'true'
        run: |
          echo "::error::The APKs are not signed with the release key, so installed copies could not update to them. Add the KEYSTORE_B64 and KEYSTORE_PASSWORD repository secrets and re-run this workflow."
          exit 1

      - name: Skip if this version is already released
        id: exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists, nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release APKs
        if: steps.exists.outputs.exists == 'false'
        uses: actions/download-artifact@v8
        with:
          name: VRClip-${{ env.VERSION }}-release-apks
          path: release/apk

      - name: Download release App Bundle
        if: steps.exists.outputs.exists == 'false'
        uses: actions/download-artifact@v8
        with:
          name: VRClip-${{ env.VERSION }}-release-aab
          path: release/aab

      - name: Verify signatures of the files being published
        if: steps.exists.outputs.exists == 'false'
        run: |
          shopt -s globstar nullglob
          .github/scripts/verify-release-signature.sh release/**/*.apk release/**/*.aab

      - name: Collect release notes
        if: steps.exists.outputs.exists == 'false'
        run: |
          .github/scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          if [ -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "Using the $VERSION section of RELEASE_NOTES.md."
          else
            echo "::notice::RELEASE_NOTES.md has no section for $VERSION; the release lists the merged pull requests only."
          fi

      - name: Publish GitHub Release
        if: steps.exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: VRClip ${{ env.TAG }}
          # GitHub appends its list of merged pull requests after these notes.
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          make_latest: 'true'
          fail_on_unmatched_files: true
          files: |
            release/apk/**/*.apk
            release/aab/**/*.aab
