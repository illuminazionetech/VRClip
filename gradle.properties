# 6g heap: packaging four ABI splits plus the universal APK for two flavors in one build
# exhausts 4g on CI runners (OutOfMemoryError in ApkFlinger during assembleRelease).
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
ABI_FILTERS=arm64-v8a;armeabi-v7a;x86;x86_64
android.useAndroidX=true
android.nonTransitiveRClass=true
# LiteRT ships litert and litert-api under the same namespace, which AGP 9's unique-namespace
# check rejects by default.
android.uniquePackageNames=false
